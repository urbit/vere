name: Feature pull request

on:
  pull_request:
    paths:
      - 'build.zig'
      - 'build.zig.zon'
      - 'ext/**'
      - '!ext/**.md'
      - 'pkg/**'
      - 'tests/**'
      - '.github/workflows/**.yml'
      - '.github/actions/**'
      - '*.sh'

#  a push to a pull request supersedes the run of the push before it
#
concurrency:
  group: feature-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  urbit:
    uses: ./.github/workflows/shared.yml
    with:
      pace: 'edge'
      upload: false
