name: Push to release

on:
  push:
    branches:
      - release
    paths:
      - 'build.zig'
      - 'build.zig.zon'
      - 'ext/**'
      - '!ext/**.md'
      - 'pkg/**'
      - 'tests/**'
      - '.github/workflows/**.yml'
      - '.github/actions/**'
      - '*.sh'

jobs:
  urbit:
    uses: ./.github/workflows/shared.yml
    with:
      pace: 'soon'
      upload: true
    secrets: inherit

  #  after the tests, with the binary they ran
  docker:
    needs: [urbit]
    uses: ./.github/workflows/docker-shared.yml
    with:
      pace: 'soon'
    secrets: inherit
