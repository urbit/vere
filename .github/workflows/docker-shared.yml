name: docker

on:
  workflow_call:
    inputs:
      pace:
        description: 'Release pace'
        type: string
        default: 'edge'
        required: false

jobs:
  urbit:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      #
      # THE BINARY
      #
      #  not built here: the image gets the 32-bit linux binary that
      #  shared.yml built and tested in this run (and uploads, when
      #  it uploads). the caller runs shared.yml as a job, and makes
      #  this one need it.
      #

      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-32
          path: dist

      - name: Take binary
        id: build
        run: |
          cp dist/32/x86_64-linux-musl/urbit docker/.

          #  an artifact doesn't keep file modes
          chmod +x docker/urbit

          test -s dist/32/VERSION
          echo version=v$(cat dist/32/VERSION) >> $GITHUB_OUTPUT

      #
      # UPLOAD TO DOCKER
      #

      - uses: docker/docker-login-action@v1.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: christian-korneck/update-container-description-action@v1
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          destination_container_repo: ${{ secrets.DOCKERHUB_USERNAME }}/vere
          provider: dockerhub
          short_description: 'Urbit: a clean-slate OS and network for the 21st century'
          readme_file: 'docker/README.md'

      - name: Build and push
        if: ${{ inputs.pace != 'live' }}
        uses: docker/build-push-action@v6
        with:
          push: true
          context: docker
          tags: tloncorp/vere:${{ steps.build.outputs.version }},tloncorp/vere:${{ inputs.pace }}

      - name: Build and push live
        if: ${{ inputs.pace == 'live' }}
        uses: docker/build-push-action@v6
        with:
          push: true
          context: docker
          tags: tloncorp/vere:latest
