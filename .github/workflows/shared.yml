name: shared

on:
  workflow_call:
    inputs:
      pace:
        description: 'Release pace'
        type: string
        default: 'edge'
        required: false
      upload:
        description: 'Upload binaries to GCP'
        type: boolean
        default: false
        required: false
      fake_tests:
        description: 'Run fake ship tests'
        type: boolean
        default: true
        required: false
      next:
        description: 'Next Kelvin version branch name'
        type: string
        default: null
        required: false
    secrets:
      GCP_CREDENTIALS:
        required: false
      GCP_PROJECT:
        required: false

env:
  UPLOAD_BASE: bootstrap.urbit.org/vere
  GH_TOKEN: ${{ github.token }}

#  the shape of a run:
#
#    build-linux (width)      the linux binary that ships
#    build (target x width)   the other binaries that ship
#    unit (width)             the unit tests, linux
#    windows-tests (width)    the unit tests for windows, cross-compiled
#    fake-ship (width)        a debugging build, booted and tested
#       -- those five start together --
#    migration, replay        the linux binaries against old piers,
#                             after build-linux
#    windows, windows-migration
#                             the windows binary and tests, run on
#                             windows, after build and windows-tests
#    upload                   after everything, if asked for
#
#  nothing is compiled twice: a job that tests a binary downloads the
#  one build made, which is the one upload publishes.
#
#  every build names its target. zig's default on linux is the host's
#  own cpu, so a build without one is for whatever machine the runner
#  happens to be: not what ships, and no use to a cache.
#
jobs:
  #  the linux binaries have a job of their own, so that the jobs
  #  that test them wait for it and not for every target.
  #
  build-linux:
    name: Build (linux, ${{ matrix.bits }}-bit)
    strategy:
      fail-fast: false
      matrix:
        bits: [64, 32]

    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build
        with:
          leg: linux
          target: x86_64-linux-musl
          pace: ${{ inputs.pace }}
          bits: ${{ matrix.bits }}

  build:
    name: Build (${{ matrix.leg }}, ${{ matrix.bits }}-bit)
    strategy:
      fail-fast: false
      matrix:
        bits: [64, 32]
        leg: [windows, aarch64-linux, aarch64-macos, x86_64-macos]
        include:
          - leg: windows
            target: x86_64-windows-gnu
          #  the rest are built to see that they build, and to upload:
          #  no job runs them. a leg each, since the windows jobs wait
          #  for the slowest leg.
          #  (build.zig's list of targets has macos without an abi, and
          #  refuses "aarch64-macos-none", though it installs to that.)
          - leg: aarch64-linux
            target: aarch64-linux-musl
          - leg: aarch64-macos
            target: aarch64-macos
          - leg: x86_64-macos
            target: x86_64-macos

    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build
        with:
          leg: ${{ matrix.leg }}
          target: ${{ matrix.target }}
          pace: ${{ inputs.pace }}
          bits: ${{ matrix.bits }}

  unit:
    name: Unit tests (${{ matrix.bits }}-bit)
    strategy:
      fail-fast: false
      matrix:
        bits: [64, 32]

    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/loom-host

      - id: zig
        uses: ./.github/actions/zig
        with:
          cache: linux-no-lto
          pace: ${{ inputs.pace }}
          bits: ${{ matrix.bits }}

      #  without lto: with it, each of twenty tests is a link that
      #  takes a minute of one core, and all of them again for any
      #  change. the tests then aren't the code generation that ships;
      #  the fake ship, migration and replay jobs run that.
      #
      #  -Dno-lto reaches the dependencies too, so these builds have
      #  a cache of their own.
      #
      - name: Build unit tests
        run: zig build test-bins -Dtarget=x86_64-linux-musl -Dno-lto $VERE_FLAGS --summary all

      - name: Save build cache
        if: ${{ steps.zig.outputs.cache-hit != 'true' && matrix.bits == 32 }}
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ steps.zig.outputs.cache-key }}

      - name: Run unit tests
        run: ./unit-tests.sh zig-out/bin

  #  the tests that run on windows are built on linux: cross-compiled,
  #  as the windows binary that ships is.
  #
  windows-tests:
    name: Build windows tests (${{ matrix.bits }}-bit)
    strategy:
      fail-fast: false
      matrix:
        bits: [64, 32]

    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - id: zig
        uses: ./.github/actions/zig
        with:
          cache: windows-no-lto
          pace: ${{ inputs.pace }}
          bits: ${{ matrix.bits }}

      #  without lto, like the linux tests (see the unit job)
      #
      - name: Build unit tests
        run: zig build test-bins -Dtarget=x86_64-windows-gnu -Dno-lto $VERE_FLAGS --summary all

      - name: Save build cache
        if: ${{ steps.zig.outputs.cache-hit != 'true' && matrix.bits == 32 }}
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: ${{ steps.zig.outputs.cache-key }}

      - name: Build loom probe
        run: |
          zig cc -target x86_64-windows-gnu  \
            -o zig-out/bin/wloom_probe.exe   \
            pkg/noun/platform/windows/wloom_probe.c

      - name: Stage artifact
        run: |
          mkdir -p dist/${{ matrix.bits }}/tests
          cp zig-out/bin/*.exe dist/${{ matrix.bits }}/tests/

      - uses: actions/upload-artifact@v4
        with:
          name: wintests-${{ matrix.bits }}
          path: dist
          if-no-files-found: error
          retention-days: 5

  fake-ship:
    name: Fake ship (${{ matrix.bits }}-bit)
    if: ${{ inputs.fake_tests }}
    strategy:
      fail-fast: false
      matrix:
        bits: [64, 32]

    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      URBIT_BINARY: "zig-out/x86_64-linux-musl/urbit-test"

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/loom-host

      - uses: ./.github/actions/zig
        with:
          cache: linux
          pace: ${{ inputs.pace }}
          bits: ${{ matrix.bits }}

      - name: Build test binary
        run: |
          zig build                    \
            -Dtarget=x86_64-linux-musl \
            $VERE_FLAGS                \
            -Dbinary-name=urbit-test   \
            -Dcpu-dbg                  \
            -Dmem-dbg                  \
            -Dc3dbg                    \
            -Dsnapshot-validation      \
            -Durth-mass                \
            --summary all

      - name: Boot fake ship
        run: ./boot-fake-ship.sh

      - name: Run fake ship tests
        run: ./test-fake-ship.sh

      - name: Overflow the C stack repeatedly
        env:
          PIER_DIR: "pier"
          OVERFLOW_RUNS: "3"
        run: ./stack-overflow-test.sh

  migration:
    name: Migration roundtrip tests
    needs: [build-linux]
    if: ${{ inputs.fake_tests }}

    runs-on: ubuntu-22.04
    timeout-minutes: 30

    env:
      VERE64_BINARY: "dist/64/x86_64-linux-musl/urbit"
      VERE32_BINARY: "dist/32/x86_64-linux-musl/urbit"

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/fixtures

      - uses: ./.github/actions/loom-host

      - uses: actions/download-artifact@v4
        with:
          pattern: bin-linux-*
          path: dist
          merge-multiple: true

      #  an artifact doesn't keep file modes
      - run: chmod +x $VERE64_BINARY $VERE32_BINARY

      - name: Run 32↔64 roundtrip migration test
        run: ./migration-test.sh

      - name: Run legacy v1–v4 migration tests
        run: ./tests/fixtures/test-legacy.sh

  replay:
    name: Replay tests (${{ matrix.bits }}-bit)
    needs: [build-linux]
    if: ${{ inputs.fake_tests }}
    strategy:
      fail-fast: false
      matrix:
        bits: [64, 32]

    runs-on: ubuntu-22.04
    timeout-minutes: 30

    env:
      VERE_BINARY: "dist/${{ matrix.bits }}/x86_64-linux-musl/urbit"

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/fixtures

      - uses: ./.github/actions/loom-host

      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-${{ matrix.bits }}
          path: dist

      - run: chmod +x $VERE_BINARY

      - name: Run yolo-replay tests
        run: ./tests/fixtures/test-yolo-replay.sh

  windows:
    name: Windows (${{ matrix.bits }}-bit)
    needs: [build, windows-tests]
    strategy:
      fail-fast: false
      matrix:
        bits: [64, 32]

    runs-on: windows-2022
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bin-windows-${{ matrix.bits }}
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: wintests-${{ matrix.bits }}
          path: dist

      #  the loom's mapping design rests on properties of the windows
      #  memory api that microsoft does not document outright -- above
      #  all, that a section's contents *and* commitment survive
      #  unmapping and remapping its view. if that ever stops holding, a
      #  save silently corrupts the snapshot rather than failing, so it
      #  is re-checked on every run rather than trusted.
      #
      - name: Loom probe
        run: dist/${{ matrix.bits }}/tests/wloom_probe.exe

      #  the linux job's tests, less events-test and plus wloom-test.
      #  events-test is posix-only (mkdtemp, nftw, /tmp), so build.zig
      #  skips it for windows targets. porting it means porting those
      #  three, not fixing a bug.
      #
      - name: Run unit tests
        run: ./unit-tests.sh dist/${{ matrix.bits }}/tests

      #  the handler itself is bitness-independent, but the stack it
      #  runs on is whatever is left under a loom of a different size,
      #  reached through a different interpreter. so: both widths.
      #
      #  more than one run is the point: the first overflow tests that
      #  the handler has stack to run on, the second that the guard page
      #  it consumed was put back. a single pass cannot tell them apart.
      #
      - name: Overflow the C stack repeatedly
        if: ${{ inputs.fake_tests }}
        env:
          URBIT_BINARY: "dist/${{ matrix.bits }}/x86_64-windows-gnu/urbit.exe"
          OVERFLOW_RUNS: "3"
        run: ./stack-overflow-test.sh

  windows-migration:
    name: Windows migration roundtrip
    needs: [build]
    if: ${{ inputs.fake_tests }}

    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: bin-windows-*
          path: dist
          merge-multiple: true

      - name: Run 32<->64 roundtrip migration test
        shell: bash
        env:
          VERE64_BINARY: "dist/64/x86_64-windows-gnu/urbit.exe"
          VERE32_BINARY: "dist/32/x86_64-windows-gnu/urbit.exe"
        run: ./migration-test.sh

  #  one job publishes everything, after every test: the binaries of
  #  both widths, then the version string that points at them.
  #
  #  (always() so that jobs skipped for fake_tests don't skip this one;
  #  a failed or cancelled job still does.)
  #
  upload:
    name: Upload to GCP
    needs: [build-linux, build, unit, fake-ship, migration, replay, windows, windows-migration]
    if: ${{ always() && !failure() && !cancelled() && inputs.upload }}

    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true

      #  the version the binaries carry, and the one `last` will name:
      #  if they differ, publish nothing.
      #
      - name: Check version
        run: |
          if [ "${{ inputs.pace }}" == "live" ]; then
            sed -nr 's/const VERSION = "(.*)"\;/\1/p' build.zig > ./VERSION
          else
            printf "$(sed -nr 's/const VERSION = "(.*)"\;/\1/p' build.zig)-%.7s" "$(git rev-parse HEAD)" > ./VERSION
          fi

          for bits in 32 64; do
            if [ "$(cat ./VERSION)" != "$(cat dist/$bits/VERSION)" ]; then
              echo "::error::version mismatch: $(cat ./VERSION) from the checkout, $(cat dist/$bits/VERSION) in the $bits-bit build"
              exit 1
            fi
          done

      - uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Upload binaries to bootstrap.urbit.org
        run: |
          set -e

          sha_version=$(cat ./VERSION)

          declare -a targets=(
            "aarch64-linux-musl linux-aarch64"
            "aarch64-macos-none macos-aarch64"
            "x86_64-linux-musl linux-x86_64"
            "x86_64-macos-none macos-x86_64"
            "x86_64-windows-gnu windows-x86_64"
          )

          if ${{ inputs.next != null }}; then
            next=$(echo "${{ inputs.next }}" | sed 's/[^0-9]//g')
            base="gs://${UPLOAD_BASE}/next/kelvin/${next}/v${sha_version}"
          else
            base="gs://${UPLOAD_BASE}/${{ inputs.pace }}/v${sha_version}"
          fi

          # We never overwrite a binary deployed to the "live" train, but we do
          # overwrite same-versioned binaries deployed to the "soon" and "edge"
          # trains.
          if [[ "${{ inputs.pace }}" == "live" ]]; then
            copy="gsutil cp -n"
          else
            copy="gsutil cp"
          fi

          for bits in 32 64; do
            for t in "${targets[@]}"; do
              IFS=' ' read zig_target target <<< "${t}"

              if [[ "$zig_target" == *"windows"* ]]; then
                urbit_static=dist/${bits}/${zig_target}/urbit.exe
              else
                urbit_static=dist/${bits}/${zig_target}/urbit
              fi

              dest="${base}/vere${bits}-v${sha_version}-${target}"

              $copy "${urbit_static}" "$dest"
              echo "upload to $dest complete."

              # 32-bit remains the default, so also publish it at the
              # pre-vere32/vere64 unprefixed path for old links/scripts
              # that still expect "vere-v...".
              if [[ "$bits" == "32" ]]; then
                legacy_dest="${base}/vere-v${sha_version}-${target}"

                $copy "$dest" "$legacy_dest"
                echo "upload to $legacy_dest complete."
              fi
            done
          done

      - name: Upload latest deployed version string to GCP
        run: |
          if ${{ inputs.next != null }}; then
            next=$(echo "${{ inputs.next }}" | sed 's/[^0-9]//g')
            target="gs://${UPLOAD_BASE}/next/kelvin/${next}/last"
          else
            target="gs://${UPLOAD_BASE}/${{ inputs.pace }}/last"
          fi

          # We don't use -n here because we want to overwrite the version
          # string.
          gsutil cp ./VERSION "$target"
          echo "Upload to $target completed successfully."
